name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lets this workflow land before the first crate does.
      - name: Detect Cargo project
        id: cargo
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Cargo.toml yet; skipping Rust checks."
          fi

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install toolchain
        if: steps.cargo.outputs.present == 'true'
        run: rustup toolchain install

      - name: Format
        if: steps.cargo.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.cargo.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.cargo.outputs.present == 'true'
        run: cargo test --workspace --all-features
